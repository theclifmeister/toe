name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # The cask bump below opens and merges its own pull request.
  pull-requests: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          # Not shallow: the cask bump below pushes to main, and git refuses to push
          # from a shallow clone.
          fetch-depth: 0

      - name: Derive version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # toe ships signed with a Developer ID certificate and stapled with an Apple
      # notarization ticket, so Gatekeeper clears it with no quarantine dance. The certificate
      # also gives the app a stable designated requirement. That requirement pins Apple's
      # anchor and certificate leaf[subject.OU] — the team ID, 4689D3AT8J — and nothing that
      # changes when the certificate is renewed, so the Accessibility grants macOS keys to it
      # persist across `brew upgrade` and across a renewal. Verify with `codesign -d -r -`,
      # which the "Verify signature" step below prints for exactly this reason.
      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.SIGNING_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/toe-signing.keychain-db"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/toe-release.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/toe-release.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this codesign blocks on a GUI keychain prompt and the job hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          rm -f "$RUNNER_TEMP/toe-release.p12"

          # find-identity exits 0 even when it finds nothing, so assert instead: without a
          # valid identity the build would fail later, inside codesign. A leaf whose issuing
          # intermediate is missing from the .p12 is the likely cause, since that chain cannot
          # be built and the identity is then not listed as valid.
          security find-identity -v -p codesigning "$keychain"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "no valid Developer ID Application identity — does SIGNING_CERT_P12_BASE64" >&2
            echo "include the Developer ID Certification Authority intermediate?" >&2
            exit 1
          fi

      - name: Test
        run: swift run -c debug toe-selftest

      - name: Build and sign
        env:
          TOE_VERSION: ${{ steps.version.outputs.version }}
          TOE_SIGN_IDENTITY: "Developer ID Application: Clifford van Slimming (${{ secrets.APPLE_TEAM_ID }})"
        run: ./scripts/bundle.sh release

      # Echo the designated requirement into the log: if it ever names a cdhash instead of a
      # certificate, or names a different certificate, this release just broke every user's
      # Accessibility grant and we want that visible rather than silent.
      - name: Verify signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 build/Toe.app
          codesign -d -r - build/Toe.app
          # Apple rejects a submission without the hardened runtime. Catching it here names
          # the problem directly, rather than as a notarization failure minutes later.
          codesign -d --verbose=2 build/Toe.app 2>&1 | grep -q "flags=.*runtime" || {
            echo "the bundle is not hardened-runtime signed — did TOE_SIGN_IDENTITY reach bundle.sh?" >&2
            exit 1
          }

      - name: Smoke test
        run: |
          set -euo pipefail
          actual="$(build/Toe.app/Contents/MacOS/toe --version)"
          expected="${{ steps.version.outputs.version }}"
          [ "$actual" = "$expected" ] || { echo "version is $actual, expected $expected"; exit 1; }

      # Sign → notarize → staple → package, in that order: stapling writes Apple's ticket
      # into the bundle, so the asset published below has to be zipped after it and not
      # before. The stapled ticket is what lets Gatekeeper clear toe on a machine that is
      # offline, or that has never seen this build.
      - name: Notarize
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$key"

          ditto -c -k --keepParent build/Toe.app "$RUNNER_TEMP/notarize.zip"

          # --wait blocks until Apple reaches a verdict and exits nonzero on anything but
          # Accepted; --timeout stops a stuck submission from burning the job's whole budget.
          if ! xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
              --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
              --wait --timeout 30m 2>&1 | tee "$RUNNER_TEMP/notary.log"; then
            # A rejection reports only "Invalid" — the per-binary reason lives in the log
            # Apple keeps against the submission id, so fetch it before failing.
            id="$(grep -oE '[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}' "$RUNNER_TEMP/notary.log" | head -1)"
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" \
                --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" || true
            fi
            exit 1
          fi

          xcrun stapler staple build/Toe.app
          xcrun stapler validate build/Toe.app
          # The end-to-end check: exactly the assessment Gatekeeper makes on a user's machine.
          spctl --assess --type execute --verbose=4 build/Toe.app

      # ditto, not zip: it preserves the bundle's metadata and keeps both the signature and
      # the stapled notarization ticket intact.
      - name: Package
        id: package
        run: |
          set -euo pipefail
          asset="toe-${{ steps.version.outputs.version }}-arm64.zip"
          ditto -c -k --keepParent build/Toe.app "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.asset }}" \
            --title "$GITHUB_REF_NAME" --generate-notes

      # main's ruleset requires every change to arrive through a pull request, so this cannot
      # push to main directly — it did until v0.2.0, where the push was rejected and left the
      # release published but the cask still pointing at the previous version. Nothing here
      # needs human review: both values are derived from the release built above, and that
      # tree was already tested. So open the PR and merge it, and the release stays a single
      # step. The ruleset permits no approvals and requires no checks, so this merges as-is.
      #
      # The commit is marked [skip ci] because this PR opens and merges within seconds, and
      # the workflows it would otherwise start cannot survive that: CI and Claude Code Review
      # both trigger on pull_request, and the branch is deleted out from under them before
      # they finish, so they fail. GitHub honours the marker on the head commit for push and
      # pull_request events, so no run is created at all — no failed runs, no wasted minutes,
      # and no Claude quota spent reviewing two mechanical lines. (A GITHUB_TOKEN-created PR
      # does still trigger those workflows, whatever the recursion guard implies; v0.4.0 is
      # where that was observed.) --subject on the merge below keeps the marker out of main.
      - name: Bump cask
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          git fetch origin main
          branch="cask-$VERSION"
          git checkout -B "$branch" origin/main
          /usr/bin/sed -i '' \
            -e "s|^  version \".*\"$|  version \"$VERSION\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$SHA256\"|" \
            Casks/toe.rb
          if git diff --quiet Casks/toe.rb; then
            echo "cask already at $VERSION"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump toe cask to $VERSION [skip ci]" Casks/toe.rb
          # Force: the branch is named per version and owned by this job, so anything already
          # at that name is debris from a failed run of this same release.
          git push --force origin "$branch"

          # Reuse the open PR if a previous run of this release already created one, because
          # gh pr create fails rather than no-ops when one exists for the branch.
          #
          # Retried for the same reason the merge below is, and learned the same way: at v0.9.1
          # this single call came back `GraphQL: Something went wrong while executing your
          # query`, which is GitHub having a bad second rather than anything wrong with the
          # request. The release was already built, notarized and published by then, and the
          # branch was already pushed — so the job failed on this line alone and left the cask
          # a version behind, which is exactly the state the whole step exists to prevent.
          #
          # The existence check is inside the loop, so a create that succeeded but reported
          # failure is found rather than attempted again.
          for attempt in 1 2 3 4 5; do
            if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
              break
            fi
            if gh pr create --base main --head "$branch" \
              --title "Bump toe cask to $VERSION" \
              --body "Generated by the release job for v$VERSION. The version and sha256 are taken from the asset built and published by that run."; then
              break
            fi
            echo "create attempt $attempt failed, retrying in 10s"
            sleep 10
          done

          if [ -z "$(gh pr list --head "$branch" --state open --json number -q '.[0].number')" ]; then
            echo "could not open the cask bump PR for $VERSION — the release is published and" >&2
            echo "$branch is pushed, so open the pull request by hand." >&2
            exit 1
          fi

          # Detach before merging, and delete the branch explicitly rather than through
          # --delete-branch: that flag also removes the local branch, which fails while it is
          # the checked-out one, and a failure there is indistinguishable from a failed merge.
          git checkout --detach

          # Mergeability is computed asynchronously, so a merge straight after create can be
          # refused for a PR that is in fact fine.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$branch" --squash --subject "Bump toe cask to $VERSION"; then
              git push origin --delete "$branch" || true
              exit 0
            fi
            echo "merge attempt $attempt failed, retrying in 10s"
            sleep 10
          done
          echo "could not merge the cask bump for $VERSION — the release is published, but" >&2
          echo "Casks/toe.rb on main still points at the previous version. Merge the PR by hand." >&2
          exit 1

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/toe-signing.keychain-db" || true
